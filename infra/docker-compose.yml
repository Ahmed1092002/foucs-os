# Docker Compose for local development
# - Postgres 16 (primary DB)
# - pgAdmin 4 (web UI at http://localhost:5050)
# - Backend API (NestJS at http://localhost:3000)
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: focus-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus_dev_password
      POSTGRES_DB: focus_os
    ports:
      - "5434:5432"
    volumes:
      - focus-os-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus -d focus_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: focus-os-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: focus-os-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://focus:focus_dev_password@postgres:5432/focus_os
      JWT_SECRET: dev-secret-change-in-production
      PORT: "3000"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5000,http://10.0.2.2:3000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/src:/app/src:ro
      - ../backend/prisma:/app/prisma:ro
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

volumes:
  focus-os-postgres-data: