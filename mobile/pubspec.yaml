name: focus_os
description: "Focus OS — a personal learning operating system for developers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.5.0

  # Local DB (Drift over Isar — see docs/06-flutter-architecture.md)
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Networking
  dio: ^5.11.0

  # Misc
  intl: ^0.20.3
  flutter_secure_storage: 9.2.4
  uuid: ^4.6.0
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.34.0   # Pin <2.34.6 to keep analyzer <6 compatible with flutter_test.

  # Launch assets
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1E1E24"
  image: "assets/icon/splash.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true