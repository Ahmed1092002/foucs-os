# Render Infrastructure as Code
# Run: render deploy --confirm

databases:
  # PostgreSQL Database
  - name: focus-os-db
    plan: free
    databaseName: focus_os
    user: focus_user
    region: oregon
    postgresMajorVersion: 16

services:

  # NestJS API Web Service
  - type: web
    name: focus-os-api
    plan: free
    region: oregon
    runtime: node
    rootDir: backend
    buildCommand: |
      npm ci --legacy-peer-deps
      npx nest build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: focus-os-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3000"
      - key: CORS_ORIGINS
        value: "https://focus-os-web.vercel.app,http://localhost:3000"
      - key: NODE_ENV
        value: "production"
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
